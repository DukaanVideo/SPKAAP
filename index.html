<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapna Pura Karenge (SPK App)</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #131b2e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #ffcc00;
            text-align: center;
        }
        h1 {
            color: #ffcc00;
            font-size: 24px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        p {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-box {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1a233a;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            border: none;
            border-radius: 8px;
            color: #0b0f19;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 Sapna Pura Karenge</h1>
        <p>Apna Gaming Ad Khud Banayein</p>
        
        <!-- Login Form (No OTP, Simple Number & Password) -->
        <input type="text" class="input-box" placeholder="Mobile Number daalein" required>
        <input type="password" class="input-box" placeholder="Password daalein" required>
        
        <button class="btn" onclick="alert('Login Successful! Studio khul raha hai...')">Login Karein</button>
    </div>

</body>
</html>
