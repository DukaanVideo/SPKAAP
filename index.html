<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DukaanVideo - Local Promo Maker</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; margin: 0; padding: 16px; color: #fff; }
        .header { background: #4a148c; color: white; padding: 20px; border-radius: 12px; text-align: center; }
        .card { background: #1e1e1e; padding: 20px; margin-top: 16px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); border: 1px solid #333; }
        select, textarea, input[type="file"], input[type="range"] { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 16px; background: #2c2c2c; color: #fff; border: 1px solid #555; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        label { color: #ffb300; font-weight: bold; font-size: 14px; display: block; margin-top: 10px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; margin-top: 10px; transition: 0.3s; }
        .btn-pay { background: #ffb300; color: #000; }
        .btn-download { background: #4CAF50; }
        .btn-disabled { background: #555; color: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0;">🎥 DukaanVideo</h2>
        <p style="margin:5px 0 0 0; font-size: 13px; color: #ddd;">Apni Dukan, Dairy, Mobile Shop ya Gaming ke liye turant video banayein!</p>
    </div>

    <div class="card">
        <!-- 1. Media Upload (Gallery / Camera) -->
        <label>1. Gallery se Photo/Video ya Camera se Live Uthayein:</label>
        <input type="file" id="mediaInput" accept="image/*,video/*" capture="environment">

        <!-- 2. Business & Game Categories (Gaming included) -->
        <label>2. Apna Business ya Game Category Chuniye:</label>
        <select id="category">
            <option>General Store / Dukaan</option>
            <option>Doodh Dairy & Paneer</option>
            <option>Mobile & Electronics Shop</option>
            <option>Mithaai & Restaurant</option>
            <option>Gaming & Tournaments 🎮</option>
        </select>

        <!-- 3. Script / Offer -->
        <label>3. Video ki Script / Offer Likhein:</label>
        <textarea id="script" rows="3">Namaskar! Humari dukan par sabhi saman saste aur uchit daam par uplabdh hai. Aaj hi visit karein!</textarea>

        <!-- 4. Voice-Over (Speaker AI) -->
        <label>4. Voice-Over (Speaker Aawaz) Chuniye:</label>
        <select id="voice">
            <option>Ladki ki Aawaz (Female AI)</option>
            <option>Ladke ki Aawaz (Male AI)</option>
            <option>Meri Apni Aawaz (Voice Clone)</option>
        </select>

        <!-- 5. Background Music & Volume Level Control -->
        <label>5. Background Music Chuniye:</label>
        <select id="bgMusic">
            <option>Upbeat Promotional Beat</option>
            <option>Gaming Action Remix</option>
            <option>Soft Acoustic Background</option>
        </select>

        <label>Music Volume / Level Control:</label>
        <input type="range" id="volumeRange" min="0" max="100" value="50">

        <!-- Action Buttons -->
        <button class="btn btn-pay" onclick="payUPI()">Pay ₹5 (Google Pay / PhonePe)</button>
        <button id="dlBtn" class="btn btn-disabled" onclick="downloadVideo()" disabled>Payment ke Baad Button Khulega 🔒</button>
    </div>

    <script>
        function payUPI() {
            const mediaInput = document.getElementById('mediaInput');
            
            // Check karein ki media select ki hai ya nahi
            if (mediaInput.files.length === 0) {
                alert("Kripya pehle dukan ki photo ya video select karein!");
                return;
            }

            // UPI Deep Link for ₹5 payment to your specific UPI ID
            window.location.href = "upi://pay?pa=Sandeepkumarsandeepku7862mar-6@oksbi&pn=DukaanVideo&am=5.00&cu=INR&tn=Dukaan%20Video%20Download%20Fee";
            
            // Simulate payment verification and unlock download button
            setTimeout(() => {
                alert("Payment verified! Video unlocked successfully. 🎉");
                const dlBtn = document.getElementById("dlBtn");
                dlBtn.disabled = false;
                dlBtn.className = "btn btn-download";
                dlBtn.innerText = "Video Download Karein (Unlocked)";
            }, 3000);
        }

        function downloadVideo() {
            alert("Aapka promo video successfully download ho gaya hai! 🚀");
        }
    </script>
</body>
</html>
