<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yolo 247 P9 - Aviator Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header / Balance Bar */
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background-color: #121826; border-bottom: 1px solid #1e293b; }
        .logo { font-size: 18px; font-weight: bold; color: #f59e0b; cursor: pointer; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .balance-badge { background: #1e293b; border: 1px solid #334155; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #38bdf8; }
        .btn-back { background: #334155; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }

        /* Multipliers History Bar */
        .history-bar { display: flex; gap: 6px; padding: 8px 12px; background: #0f172a; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #1e293b; }
        .history-chip { background: #1e293b; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; color: #22c55e; border: 1px solid #334155; }
        .history-chip.high { color: #f59e0b; }

        /* Main Container */
        .main-container { flex: 1; display: flex; flex-direction: column; padding: 10px; max-width: 500px; margin: 0 auto; width: 100%; gap: 10px; }
        
        /* Game Screen Box */
        .game-screen { position: relative; width: 100%; height: 230px; background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #31102b 100%); border: 2px solid #3b82f6; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.7); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .multiplier-display { position: relative; z-index: 2; font-size: 46px; font-weight: bold; color: #ffffff; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8); }
        .status-display { position: relative; z-index: 2; font-size: 13px; color: #94a3b8; margin-top: 4px; }

        /* Betting Section */
        .bets-section { display: flex; flex-direction: column; gap: 10px; }
        .bet-card { background-color: #121826; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        
        .bet-top-row { display: flex; justify-content: space-between; align-items: center; }
        .auto-cash-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; cursor: pointer; }
        .auto-cash-input { width: 55px; padding: 2px 4px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; text-align: center; font-size: 12px; }

        .bet-main-row { display: flex; gap: 8px; align-items: center; }
        .input-box-group { display: flex; align-items: center; background: #0f172a; border: 1px solid #334155; border-radius: 8px; overflow: hidden; flex: 1; }
        .btn-pm { background: #1e293b; color: white; border: none; padding: 10px 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-pm:active { background: #334155; }
        .input-box-group input { width: 100%; padding: 8px; background: transparent; border: none; color: white; font-size: 15px; text-align: center; font-weight: bold; outline: none; }

        .btn-place-bet { background-color: #facc15; color: #000000; border: none; padding: 12px 16px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; flex: 1; transition: 0.2s; }
        .btn-place-bet.cashout { background-color: #ef4444; color: #ffffff; }
        .btn-place-bet:disabled { background-color: #334155; color: #94a3b8; cursor: not-allowed; }

        /* Quick Amount Shortcuts (200, 1000, 10000, Max) */
        .shortcuts-row { display: flex; gap: 6px; }
        .shortcut-btn { flex: 1; background: #1e293b; border: 1px solid #334155; color: #cbd5e1; font-size: 11px; padding: 4px; border-radius: 4px; cursor: pointer; text-align: center; }
        .shortcut-btn:active { background: #334155; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background-color: #121826; padding: 24px; border-radius: 12px; width: 90%; max-width: 350px; border: 1px solid #334155; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 14px; }
        .btn-submit { width: 100%; background-color: #f59e0b; color: #0b0f19; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="openAdminCheck()">Yolo 247 P9</div>
        <div class="header-right">
            <div class="balance-badge" id="userBalanceDisplay">₹ 1,000.00</div>
            <button class="btn-back" onclick="window.location.href='index.html'">Portal</button>
        </div>
    </header>

    <!-- History Bar -->
    <div class="history-bar" id="historyBar">
        <div class="history-chip">1.47x</div>
        <div class="history-chip">1.44x</div>
        <div class="history-chip high">13.27x</div>
        <div class="history-chip">2.39x</div>
        <div class="history-chip">3.88x</div>
        <div class="history-chip">4.29x</div>
    </div>

    <div class="main-container">
        
        <!-- Game Screen with Canvas Jet -->
        <div class="game-screen">
            <div class="multiplier-display" id="multiplierDisplay">1.00x</div>
            <div class="status-display" id="statusDisplay">Next round starting in 15s...</div>
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Double Betting Cards -->
        <div class="bets-section">
            
            <!-- Bet Card 1 -->
            <div class="bet-card">
                <div class="bet-top-row">
                    <label class="auto-cash-label"><input type="checkbox" id="autoCashCheck1"> Auto Cash Out</label>
                    <input type="number" id="autoCashVal1" class="auto-cash-input" step="0.1" value="2.00">
                </div>
                <div class="bet-main-row">
                    <div class="input-box-group">
                        <button class="btn-pm" onclick="adjustBet(1, -50)">-</button>
                        <input type="number" id="betInput1" value="100">
                        <button class="btn-pm" onclick="adjustBet(1, 50)">+</button>
                    </div>
                    <button class="btn-place-bet" id="btnBet1" onclick="handleBetAction(1)">Bet (15s)</button>
                </div>
                <div class="shortcuts-row">
                    <div class="shortcut-btn" onclick="setShortcut(1, 200)">200</div>
                    <div class="shortcut-btn" onclick="setShortcut(1, 1000)">1,000</div>
                    <div class="shortcut-btn" onclick="setShortcut(1, 10000)">10,000</div>
                    <div class="shortcut-btn" onclick="setShortcut(1, 50000)">Max</div>
                </div>
            </div>

            <!-- Bet Card 2 -->
            <div class="bet-card">
                <div class="bet-top-row">
                    <label class="auto-cash-label"><input type="checkbox" id="autoCashCheck2"> Auto Cash Out</label>
                    <input type="number" id="autoCashVal2" class="auto-cash-input" step="0.1" value="2.00">
                </div>
                <div class="bet-main-row">
                    <div class="input-box-group">
                        <button class="btn-pm" onclick="adjustBet(2, -50)">-</button>
                        <input type="number" id="betInput2" value="100">
                        <button class="btn-pm" onclick="adjustBet(2, 50)">+</button>
                    </div>
                    <button class="btn-place-bet" id="btnBet2" onclick="handleBetAction(2)">Bet (15s)</button>
                </div>
                <div class="shortcuts-row">
                    <div class="shortcut-btn" onclick="setShortcut(2, 200)">200</div>
                    <div class="shortcut-btn" onclick="setShortcut(2, 1000)">1,000</div>
                    <div class="shortcut-btn" onclick="setShortcut(2, 10000)">10,000</div>
                    <div class="shortcut-btn" onclick="setShortcut(2, 50000)">Max</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3 style="color: #f59e0b; margin-bottom: 12px;">Admin Setup Control</h3>
            <div class="form-group">
                <label>Next Crash Multiplier Set Karein</label>
                <input type="number" id="targetCrashInput" step="0.1" value="2.00">
            </div>
            <button class="btn-submit" onclick="saveAdminSettings()">Save Settings</button>
        </div>
    </div>

    <script>
        let customCrashMultiplier = 2.00;
        let userBalance = 1000.00;

        function updateBalanceUI() {
            document.getElementById('userBalanceDisplay').innerText = "₹ " + userBalance.toLocaleString('en-IN', {minimumFractionDigits: 2});
        }

        function openAdminCheck() {
            let pass = prompt("Admin Panel password daalein:");
            if (pass === "904402") {
                document.getElementById('adminModal').style.display = 'flex';
            } else if(pass !== null) {
                alert("Galat password!");
            }
        }

        function saveAdminSettings() {
            let val = parseFloat(document.getElementById('targetCrashInput').value);
            if(val >= 1.00) {
                customCrashMultiplier = val;
                alert("Settings Saved! Crash target: " + customCrashMultiplier + "x");
                document.getElementById('adminModal').style.display = 'none';
            } else {
                alert("Sahi value daalein.");
            }
        }

        function adjustBet(boxNum, amount) {
            let inp = document.getElementById('betInput' + boxNum);
            let val = parseInt(inp.value) || 0;
            val += amount;
            if(val < 10) val = 10;
            inp.value = val;
        }

        function setShortcut(boxNum, amount) {
            document.getElementById('betInput' + boxNum).value = amount;
        }

        // Canvas Jet Animation
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameTimer = null;
        let flightInterval = null;
        let gameState = 'WAITING';
        let currentMultiplier = 1.00;
        let countdownTime = 15;

        let bet1State = 'NONE'; // NONE, PLACED, CASHED
        let bet2State = 'NONE';
        let bet1Amount = 0;
        let bet2Amount = 0;

        function drawJetScene(progressRatio, isCrashed = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background grid lines
            ctx.strokeStyle = 'rgba(59, 130, 246, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 30) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 30) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            let startX = 30;
            let startY = canvas.height - 30;
            let endX = canvas.width - 50;
            let endY = 40;

            let currentX = startX + (endX - startX) * progressRatio;
            let currentY = startY - (startY - endY) * progressRatio;

            if (gameState === 'FLYING' || isCrashed) {
                // Flight curve line
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(canvas.width * 0.4, canvas.height - 20, currentX, currentY);
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Draw Jet Fighter Icon (Yellow & Black)
                ctx.save();
                ctx.translate(currentX, currentY);
                ctx.rotate(isCrashed ? 0.8 : -0.3);

                // Jet body
                ctx.fillStyle = isCrashed ? '#ef4444' : '#facc15';
                ctx.beginPath();
                ctx.moveTo(18, 0);
                ctx.lineTo(-14, -7);
                ctx.lineTo(-8, 0);
                ctx.lineTo(-14, 7);
                ctx.closePath();
                ctx.fill();

                // Jet nose / cockpit accent
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.moveTo(18, 0);
                ctx.lineTo(8, -2);
                ctx.lineTo(8, 2);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            } else {
                // Resting Jet at bottom-left corner
                ctx.save();
                ctx.translate(startX, startY);
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.moveTo(18, 0);
                ctx.lineTo(-14, -7);
                ctx.lineTo(-8, 0);
                ctx.lineTo(-14, 7);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        window.onload = function() {
            resizeCanvas();
            updateBalanceUI();
            startWaitingPhase();
        }

        function startWaitingPhase() {
            gameState = 'WAITING';
            countdownTime = 15;
            currentMultiplier = 1.00;

            document.getElementById('multiplierDisplay').innerText = "1.00x";
            drawJetScene(0);

            let b1 = document.getElementById('btnBet1');
            let b2 = document.getElementById('btnBet2');

            if (bet1State === 'PLACED') {
                b1.innerText = "Bet Placed";
                b1.className = "btn-place-bet cashout";
                b1.disabled = true;
            } else {
                bet1State = 'NONE';
                b1.innerText = "Bet (15s)";
                b1.className = "btn-place-bet";
                b1.disabled = false;
            }

            if (bet2State === 'PLACED') {
                b2.innerText = "Bet Placed";
                b2.className = "btn-place-bet cashout";
                b2.disabled = true;
            } else {
                bet2State = 'NONE';
                b2.innerText = "Bet (15s)";
                b2.className = "btn-place-bet";
                b2.disabled = false;
            }

            clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                countdownTime--;
                document.getElementById('statusDisplay').innerText = "Next round starting in " + countdownTime + "s...";
                if (bet1State !== 'PLACED') b1.innerText = "Bet (" + countdownTime + "s)";
                if (bet2State !== 'PLACED') b2.innerText = "Bet (" + countdownTime + "s)";

                if (countdownTime <= 0) {
                    clearInterval(gameTimer);
                    startFlyingPhase();
                }
            }, 1000);
        }

        function startFlyingPhase() {
            gameState = 'FLYING';
            currentMultiplier = 1.00;
            document.getElementById('statusDisplay').innerText = "Jet is flying...";

            let b1 = document.getElementById('btnBet1');
            if (bet1State === 'PLACED') {
                b1.innerText = "CASH OUT";
                b1.className = "btn-place-bet cashout";
                b1.disabled = false;
            } else {
                b1.innerText = "Running...";
                b1.disabled = true;
            }

            let b2 = document.getElementById('btnBet2');
            if (bet2State === 'PLACED') {
                b2.innerText = "CASH OUT";
                b2.className = "btn-place-bet cashout";
                b2.disabled = false;
            } else {
                b2.innerText = "Running...";
                b2.disabled = true;
            }

            let targetCrash = customCrashMultiplier;

            clearInterval(flightInterval);
            flightInterval = setInterval(() => {
                currentMultiplier += 0.04;
                document.getElementById('multiplierDisplay').innerText = currentMultiplier.toFixed(2) + "x";

                let ratio = (currentMultiplier - 1.00) / (targetCrash - 1.00);
                if (ratio > 1) ratio = 1;

                drawJetScene(ratio);

                // Auto Cashout Check Box 1
                if (bet1State === 'PLACED' && document.getElementById('autoCashCheck1').checked) {
                    let target1 = parseFloat(document.getElementById('autoCashVal1').value) || 2.00;
                    if (currentMultiplier >= target1) {
                        executeCashOut(1);
                    }
                }

                // Auto Cashout Check Box 2
                if (bet2State === 'PLACED' && document.getElementById('autoCashCheck2').checked) {
                    let target2 = parseFloat(document.getElementById('autoCashVal2').value) || 2.00;
                    if (currentMultiplier >= target2) {
                        executeCashOut(2);
                    }
                }

                if (currentMultiplier >= targetCrash) {
                    clearInterval(flightInterval);
                    triggerCrash();
                }
            }, 100);
        }

        function triggerCrash() {
            gameState = 'CRASHED';
            document.getElementById('multiplierDisplay').innerText = "CRASHED (" + currentMultiplier.toFixed(2) + "x)";
            document.getElementById('statusDisplay').innerText = "Round ended. Restarting...";

            drawJetScene(1, true);

            let b1 = document.getElementById('btnBet1');
            let b2 = document.getElementById('btnBet2');

            b1.disabled = true; b1.className = "btn-place-bet";
            b2.disabled = true; b2.className = "btn-place-bet";

            if (bet1State === 'PLACED') { bet1State = 'NONE'; b1.innerText = "Lost"; }
            if (bet2State === 'PLACED') { bet2State = 'NONE'; b2.innerText = "Lost"; }

            // Add to history bar
            let historyBar = document.getElementById('historyBar');
            let chip = document.createElement('div');
            chip.className = currentMultiplier >= 10 ? 'history-chip high' : 'history-chip';
            chip.innerText = currentMultiplier.toFixed(2) + 'x';
            historyBar.prepend(chip);

            setTimeout(() => {
                startWaitingPhase();
            }, 3000);
        }

        function handleBetAction(boxNum) {
            let amtInput = document.getElementById('betInput' + boxNum);
            let amt = parseFloat(amtInput.value) || 0;
            let btn = document.getElementById('btnBet' + boxNum);

            if (gameState === 'WAITING') {
                if (userBalance < amt) {
                    alert("Balance kam hai!");
                    return;
                }
                userBalance -= amt;
                updateBalanceUI();

                if (boxNum === 1) { bet1State = 'PLACED'; bet1Amount = amt; }
                else { bet2State = 'PLACED'; bet2Amount = amt; }

                btn.innerText = "Bet Placed";
                btn.className = "btn-place-bet cashout";
                btn.disabled = true;
            } 
            else if (gameState === 'FLYING') {
                if (boxNum === 1 && bet1State === 'PLACED') {
                    executeCashOut(1);
                } else if (boxNum === 2 && bet2State === 'PLACED') {
                    executeCashOut(2);
                }
            }
        }

        function executeCashOut(boxNum) {
            let amt = (boxNum === 1) ? bet1Amount : bet2Amount;
            let winAmt = Math.floor(amt * currentMultiplier);
            userBalance += winAmt;
            updateBalanceUI();

            let btn = document.getElementById('btnBet' + boxNum);
            if (boxNum === 1) { bet1State = 'CASHED'; }
            else { bet2State = 'CASHED'; }

            btn.innerText = "Won ₹" + winAmt;
            btn.disabled = true;
            alert("Cash Out Successful! Aapne jeete: ₹ " + winAmt);
        }
    </script>
</body>
</html>
