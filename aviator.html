<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yolo 247 P9 - Aviator Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #090d16; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background-color: #1e293b; border-bottom: 1px solid #334155; }
        .logo { font-size: 18px; font-weight: bold; color: #f59e0b; cursor: pointer; }
        .btn-back { background: #334155; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }

        /* Main Game Area */
        .main-container { flex: 1; display: flex; flex-direction: column; padding: 12px; max-width: 650px; margin: 0 auto; width: 100%; }
        
        /* Canvas Screen for Plane Animation */
        .aviator-screen-box { position: relative; width: 100%; height: 280px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border: 2px solid #3b82f6; border-radius: 12px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        canvas { display: block; width: 100%; height: 100%; }
        
        .center-multiplier { position: absolute; top: 15px; left: 20px; font-size: 36px; font-weight: bold; color: #f59e0b; text-shadow: 0 2px 10px rgba(245, 158, 11, 0.4); pointer-events: none; }
        .status-text { position: absolute; bottom: 12px; left: 20px; font-size: 14px; color: #94a3b8; pointer-events: none; }
        
        .score-board { font-size: 14px; color: #38bdf8; margin-bottom: 8px; text-align: right; font-weight: bold; }

        /* Double Betting Panels with Auto & Plus/Minus */
        .bets-section { display: flex; flex-direction: column; gap: 12px; }
        .bet-box { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .bet-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        
        .bet-input-group { display: flex; align-items: center; background: #0f172a; border: 1px solid #475569; border-radius: 6px; overflow: hidden; flex: 1; }
        .btn-pm { background: #334155; color: white; border: none; padding: 8px 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-pm:active { background: #475569; }
        .bet-input-group input { width: 100%; padding: 8px; background: transparent; border: none; color: white; font-size: 15px; outline: none; text-align: center; font-weight: bold; }
        
        .btn-bet { background-color: #22c55e; color: white; border: none; padding: 10px 16px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; flex: 1; transition: 0.2s; }
        .btn-bet.cashout { background-color: #ef4444; }
        .btn-bet:disabled { background-color: #475569; color: #94a3b8; cursor: not-allowed; }

        /* Auto Settings Row */
        .auto-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #94a3b8; background: #0f172a; padding: 6px 10px; border-radius: 6px; border: 1px solid #334155; }
        .auto-row label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: #e2e8f0; }
        .auto-cash-input { width: 60px; padding: 2px 6px; background: #1e293b; border: 1px solid #475569; color: white; border-radius: 4px; text-align: center; font-size: 12px; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background-color: #1e293b; padding: 24px; border-radius: 12px; width: 90%; max-width: 350px; border: 1px solid #475569; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 14px; }
        .btn-submit { width: 100%; background-color: #f59e0b; color: #0f172a; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="openAdminCheck()">Yolo 247 P9</div>
        <button class="btn-back" onclick="window.location.href='index.html'">Portal Par Jayein</button>
    </header>

    <div class="main-container">
        <div class="score-board">Total Profit / Score: <span id="gameScore">0</span></div>
        
        <!-- Canvas Screen jahan Jahaj Udega -->
        <div class="aviator-screen-box">
            <div class="center-multiplier" id="multiplierDisplay">1.00x</div>
            <div class="status-text" id="statusDisplay">Next round starting in 15s...</div>
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Double Betting Panels with Auto & Plus/Minus -->
        <div class="bets-section">
            
            <!-- Bet Panel 1 -->
            <div class="bet-box">
                <div class="bet-row">
                    <div class="bet-input-group">
                        <button class="btn-pm" onclick="changeBet(1, -10)">-</button>
                        <input type="number" id="betAmount1" value="100">
                        <button class="btn-pm" onclick="changeBet(1, 10)">+</button>
                    </div>
                    <button class="btn-bet" id="btnBet1" onclick="handleBet(1)">Place Bet (15s)</button>
                </div>
                <div class="auto-row">
                    <label><input type="checkbox" id="autoBet1"> Auto Bet</label>
                    <label>Auto Cash Out @ <input type="number" id="autoCash1" class="auto-cash-input" step="0.1" value="2.00">x</label>
                </div>
            </div>

            <!-- Bet Panel 2 -->
            <div class="bet-box">
                <div class="bet-row">
                    <div class="bet-input-group">
                        <button class="btn-pm" onclick="changeBet(2, -10)">-</button>
                        <input type="number" id="betAmount2" value="100">
                        <button class="btn-pm" onclick="changeBet(2, 10)">+</button>
                    </div>
                    <button class="btn-bet" id="btnBet2" onclick="handleBet(2)">Place Bet (15s)</button>
                </div>
                <div class="auto-row">
                    <label><input type="checkbox" id="autoBet2"> Auto Bet</label>
                    <label>Auto Cash Out @ <input type="number" id="autoCash2" class="auto-cash-input" step="0.1" value="2.00">x</label>
                </div>
            </div>

        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3 style="color: #f59e0b; margin-bottom: 12px;">Admin Setup Control</h3>
            <div class="form-group">
                <label>Next Crash Multiplier Set Karein</label>
                <input type="number" id="targetCrashInput" step="0.1" value="2.00">
            </div>
            <button class="btn-submit" onclick="saveAdminSettings()">Save Settings</button>
        </div>
    </div>

    <script>
        let customCrashMultiplier = 2.00;

        function openAdminCheck() {
            let pass = prompt("Admin Panel password daalein:");
            if (pass === "904402") {
                document.getElementById('adminModal').style.display = 'flex';
            } else if(pass !== null) {
                alert("Galat password!");
            }
        }

        function saveAdminSettings() {
            let val = parseFloat(document.getElementById('targetCrashInput').value);
            if(val >= 1.00) {
                customCrashMultiplier = val;
                alert("Settings Saved! Crash target: " + customCrashMultiplier + "x");
                document.getElementById('adminModal').style.display = 'none';
            } else {
                alert("Sahi value daalein.");
            }
        }

        function changeBet(boxNum, amount) {
            let inputField = document.getElementById('betAmount' + boxNum);
            let currentVal = parseInt(inputField.value) || 0;
            let newVal = currentVal + amount;
            if (newVal < 10) newVal = 10;
            inputField.value = newVal;
        }

        // Canvas Setup & Plane Animation
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameTimer = null;
        let flightInterval = null;
        let gameState = 'WAITING';
        let currentMultiplier = 1.00;
        let countdownTime = 15;
        let totalScore = 0;

        let bet1Placed = false;
        let bet1CashedOut = false;
        let bet2Placed = false;
        let bet2CashedOut = false;

        let planeX = 40;
        let planeY = canvas.height - 40;

        function drawScene(progressRatio, isCrashed = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Grid Lines (Aasmaan Background)
            ctx.strokeStyle = 'rgba(59, 130, 246, 0.15)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            if (gameState === 'FLYING' || isCrashed) {
                // Flight Path Curve from bottom-left corner upwards
                ctx.beginPath();
                ctx.moveTo(40, canvas.height - 30);
                ctx.quadraticCurveTo(canvas.width * 0.4, canvas.height - 30, planeX, planeY);
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Fill under curve
                ctx.lineTo(planeX, canvas.height - 30);
                ctx.lineTo(40, canvas.height - 30);
                ctx.fillStyle = 'rgba(245, 158, 11, 0.1)';
                ctx.fill();

                // Draw Plane (Jahaj) Icon
                ctx.save();
                ctx.translate(planeX, planeY);
                if (!isCrashed) {
                    ctx.rotate(-0.25); // Tilting upwards
                } else {
                    ctx.rotate(0.8); // Crash tilt
                }
                
                // Plane Body
                ctx.fillStyle = isCrashed ? '#ef4444' : '#f59e0b';
                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(-15, -8);
                ctx.lineTo(-10, 0);
                ctx.lineTo(-15, 8);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            } else {
                // Waiting state: Plane resting at bottom-left corner
                ctx.save();
                ctx.translate(40, canvas.height - 30);
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(-15, -8);
                ctx.lineTo(-10, 0);
                ctx.lineTo(-15, 8);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        window.onload = function() {
            resizeCanvas();
            startWaitingPhase();
        }

        function startWaitingPhase() {
            gameState = 'WAITING';
            countdownTime = 15;
            currentMultiplier = 1.00;
            planeX = 40;
            planeY = canvas.height - 30;

            bet1CashedOut = false;
            bet2CashedOut = false;

            document.getElementById('multiplierDisplay').innerText = "1.00x";
            drawScene(0);
            
            let b1 = document.getElementById('btnBet1');
            let b2 = document.getElementById('btnBet2');

            if (document.getElementById('autoBet1').checked) {
                bet1Placed = true;
                b1.innerText = "Auto Bet Placed";
                b1.className = "btn-bet cashout";
                b1.disabled = true;
            } else {
                bet1Placed = false;
                b1.innerText = "Place Bet (15s)";
                b1.className = "btn-bet";
                b1.disabled = false;
            }

            if (document.getElementById('autoBet2').checked) {
                bet2Placed = true;
                b2.innerText = "Auto Bet Placed";
                b2.className = "btn-bet cashout";
                b2.disabled = true;
            } else {
                bet2Placed = false;
                b2.innerText = "Place Bet (15s)";
                b2.className = "btn-bet";
                b2.disabled = false;
            }

            clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                countdownTime--;
                document.getElementById('statusDisplay').innerText = "Next round starting in " + countdownTime + "s...";
                if(!bet1Placed) b1.innerText = "Place Bet (" + countdownTime + "s)";
                if(!bet2Placed) b2.innerText = "Place Bet (" + countdownTime + "s)";

                if (countdownTime <= 0) {
                    clearInterval(gameTimer);
                    startFlyingPhase();
                }
            }, 1000);
        }

        function startFlyingPhase() {
            gameState = 'FLYING';
            currentMultiplier = 1.00;
            document.getElementById('statusDisplay').innerText = "Plane is flying...";

            let b1 = document.getElementById('btnBet1');
            if (bet1Placed) {
                b1.innerText = "CASH OUT";
                b1.className = "btn-bet cashout";
                b1.disabled = false;
            } else {
                b1.innerText = "Waiting...";
                b1.disabled = true;
            }

            let b2 = document.getElementById('btnBet2');
            if (bet2Placed) {
                b2.innerText = "CASH OUT";
                b2.className = "btn-bet cashout";
                b2.disabled = false;
            } else {
                b2.innerText = "Waiting...";
                b2.disabled = true;
            }

            let targetCrash = customCrashMultiplier;
            let startX = 40;
            let startY = canvas.height - 30;
            let maxDestX = canvas.width - 60;
            let maxDestY = 40; // Top boundary limit

            clearInterval(flightInterval);
            flightInterval = setInterval(() => {
                currentMultiplier += 0.04;
                document.getElementById('multiplierDisplay').innerText = currentMultiplier.toFixed(2) + "x";

                // Progress ratio based on multiplier growth towards target crash
                let ratio = (currentMultiplier - 1.00) / (targetCrash - 1.00);
                if (ratio > 1) ratio = 1;

                // Plane moves from bottom-left towards top-right within boundaries
                planeX = startX + (maxDestX - startX) * ratio;
                planeY = startY - (startY - maxDestY) * ratio;

                drawScene(ratio);

                // Auto Cash Out check for Box 1
                if (bet1Placed && !bet1CashedOut) {
                    let autoTarget1 = parseFloat(document.getElementById('autoCash1').value) || 2.00;
                    if (currentMultiplier >= autoTarget1) {
                        autoCashOut(1);
                    }
                }

                // Auto Cash Out check for Box 2
                if (bet2Placed && !bet2CashedOut) {
                    let autoTarget2 = parseFloat(document.getElementById('autoCash2').value) || 2.00;
                    if (currentMultiplier >= autoTarget2) {
                        autoCashOut(2);
                    }
                }

                if (currentMultiplier >= targetCrash) {
                    clearInterval(flightInterval);
                    triggerCrash();
                }
            }, 100);
        }

        function autoCashOut(boxNum) {
            if (boxNum === 1 && bet1Placed && !bet1CashedOut) {
                bet1CashedOut = true;
                let amt = parseFloat(document.getElementById('betAmount1').value) || 100;
                let win = Math.floor(amt * currentMultiplier);
                totalScore += win;
                document.getElementById('gameScore').innerText = totalScore;
                let b1 = document.getElementById('btnBet1');
                b1.innerText = "Auto Cashed (" + currentMultiplier.toFixed(2) + "x)";
                b1.disabled = true;
            } else if (boxNum === 2 && bet2Placed && !bet2CashedOut) {
                bet2CashedOut = true;
                let amt = parseFloat(document.getElementById('betAmount2').value) || 100;
                let win = Math.floor(amt * currentMultiplier);
                totalScore += win;
                document.getElementById('gameScore').innerText = totalScore;
                let b2 = document.getElementById('btnBet2');
                b2.innerText = "Auto Cashed (" + currentMultiplier.toFixed(2) + "x)";
                b2.disabled = true;
            }
        }

        function triggerCrash() {
            gameState = 'CRASHED';
            document.getElementById('multiplierDisplay').innerText = "CRASHED (" + currentMultiplier.toFixed(2) + "x)";
            document.getElementById('statusDisplay').innerText = "Round ended. Restarting...";

            drawScene(1, true); // Draw crashed plane

            let b1 = document.getElementById('btnBet1');
            let b2 = document.getElementById('btnBet2');

            b1.disabled = true; b1.className = "btn-bet";
            b2.disabled = true; b2.className = "btn-bet";

            if (bet1Placed && !bet1CashedOut) b1.innerText = "Lost";
            if (bet2Placed && !bet2CashedOut) b2.innerText = "Lost";

            setTimeout(() => {
                startWaitingPhase();
            }, 3000);
        }

        function handleBet(boxNum) {
            if (gameState === 'WAITING') {
                if (boxNum === 1) {
                    bet1Placed = true;
                    let b1 = document.getElementById('btnBet1');
                    b1.innerText = "Bet Placed (Waiting)";
                    b1.disabled = true;
                } else {
                    bet2Placed = true;
                    let b2 = document.getElementById('btnBet2');
                    b2.innerText = "Bet Placed (Waiting)";
                    b2.disabled = true;
                }
            } else if (gameState === 'FLYING') {
                if (boxNum === 1 && bet1Placed && !bet1CashedOut) {
                    bet1CashedOut = true;
                    let amt = parseFloat(document.getElementById('betAmount1').value) || 100;
                    let win = Math.floor(amt * currentMultiplier);
                    totalScore += win;
                    document.getElementById('gameScore').innerText = totalScore;
                    alert("Bet 1 Cash Out Successful! Jeete: ₹" + win);
                    let b1 = document.getElementById('btnBet1');
                    b1.innerText = "Cashed Out (" + currentMultiplier.toFixed(2) + "x)";
                    b1.disabled = true;
                } else if (boxNum === 2 && bet2Placed && !bet2CashedOut) {
                    bet2CashedOut = true;
                    let amt = parseFloat(document.getElementById('betAmount2').value) || 100;
                    let win = Math.floor(amt * currentMultiplier);
                    totalScore += win;
                    document.getElementById('gameScore').innerText = totalScore;
                    alert("Bet 2 Cash Out Successful! Jeete: ₹" + win);
                    let b2 = document.getElementById('btnBet2');
                    b2.innerText = "Cashed Out (" + currentMultiplier.toFixed(2) + "x)";
                    b2.disabled = true;
                }
            }
        }
    </script>
</body>
</html>
