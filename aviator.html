<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yolo 247 P9 - Aviator Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px; }
        .game-container { background-color: #1e293b; padding: 24px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #475569; text-align: center; position: relative; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .logo { font-size: 16px; font-weight: bold; color: #f59e0b; cursor: pointer; }
        .btn-back { background: #334155; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .aviator-screen { background: #090d16; border: 2px solid #3b82f6; border-radius: 8px; height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; margin-bottom: 12px; }
        .multiplier-text { font-size: 28px; font-weight: bold; color: #f59e0b; }
        .status-text { font-size: 14px; color: #94a3b8; margin-top: 4px; }
        .btn-action { width: 100%; background-color: #22c55e; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-action.cashout { background-color: #ef4444; }
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background-color: #1e293b; padding: 24px; border-radius: 12px; width: 90%; max-width: 350px; border: 1px solid #475569; position: relative; text-align: left; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 14px; }
        .btn-submit { width: 100%; background-color: #f59e0b; color: #0f172a; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header-top">
            <div class="logo" onclick="openAdminCheck()">Yolo 247 P9</div>
            <button class="btn-back" onclick="window.location.href='index.html'">Portal Par Jayein</button>
        </div>
        
        <h3>Aviator Arena</h3>
        <div style="font-size: 14px; color: #f59e0b; margin-bottom: 10px;">Score: <span id="gameScore">0</span></div>
        
        <div class="aviator-screen">
            <div class="multiplier-text" id="multiplierDisplay">1.00x</div>
            <div class="status-text" id="statusDisplay">Next round starting in 15s...</div>
        </div>
        
        <button class="btn-action" id="actionBtn" onclick="handleGameAction()">Place Bet (15s)</button>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3>Admin Setup Control</h3>
            <div class="form-group">
                <label>Next Crash Multiplier Set Karein</label>
                <input type="number" id="targetCrashInput" step="0.1" value="2.00">
            </div>
            <button class="btn-submit" onclick="saveAdminSettings()">Save Settings</button>
        </div>
    </div>

    <script>
        let customCrashMultiplier = 2.00;

        function openAdminCheck() {
            let pass = prompt("Admin Panel password daalein:");
            if (pass === "904402") {
                document.getElementById('adminModal').style.display = 'flex';
            } else if(pass !== null) {
                alert("Galat password!");
            }
        }

        function saveAdminSettings() {
            let val = parseFloat(document.getElementById('targetCrashInput').value);
            if(val >= 1.00) {
                customCrashMultiplier = val;
                alert("Settings Saved! Crash target: " + customCrashMultiplier + "x");
                document.getElementById('adminModal').style.display = 'none';
            } else {
                alert("Sahi value daalein.");
            }
        }

        let gameTimer = null;
        let flightInterval = null;
        let gameState = 'WAITING';
        let currentMultiplier = 1.00;
        let countdownTime = 15;
        let userBetPlaced = false;
        let userCashedOut = false;
        let score = 0;

        window.onload = function() {
            startWaitingPhase();
        }

        function startWaitingPhase() {
            gameState = 'WAITING';
            countdownTime = 15;
            userBetPlaced = false;
            userCashedOut = false;
            currentMultiplier = 1.00;

            document.getElementById('multiplierDisplay').innerText = "1.00x";
            document.getElementById('actionBtn').innerText = "Place Bet (15s)";
            document.getElementById('actionBtn').className = "btn-action";
            document.getElementById('actionBtn').disabled = false;

            clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                countdownTime--;
                document.getElementById('statusDisplay').innerText = "Next round starting in " + countdownTime + "s...";
                document.getElementById('actionBtn').innerText = "Place Bet (" + countdownTime + "s)";

                if (countdownTime <= 0) {
                    clearInterval(gameTimer);
                    startFlyingPhase();
                }
            }, 1000);
        }

        function startFlyingPhase() {
            gameState = 'FLYING';
            currentMultiplier = 1.00;
            document.getElementById('statusDisplay').innerText = "Plane is flying...";
            
            if (userBetPlaced) {
                document.getElementById('actionBtn').innerText = "CASH OUT";
                document.getElementById('actionBtn').className = "btn-action cashout";
            } else {
                document.getElementById('actionBtn').innerText = "Waiting for next round";
                document.getElementById('actionBtn').disabled = true;
            }

            let targetCrash = customCrashMultiplier;

            clearInterval(flightInterval);
            flightInterval = setInterval(() => {
                currentMultiplier += 0.04;
                document.getElementById('multiplierDisplay').innerText = currentMultiplier.toFixed(2) + "x";

                if (currentMultiplier >= targetCrash) {
                    clearInterval(flightInterval);
                    triggerCrash();
                }
            }, 100);
        }

        function triggerCrash() {
            gameState = 'CRASHED';
            document.getElementById('multiplierDisplay').innerText = "CRASHED (" + currentMultiplier.toFixed(2) + "x)";
            document.getElementById('statusDisplay').innerText = "Round ended. Restarting...";
            document.getElementById('actionBtn').innerText = "Crashed";
            document.getElementById('actionBtn').className = "btn-action";
            document.getElementById('actionBtn').disabled = true;

            if (userBetPlaced && !userCashedOut) {
                alert("Aapka Bet haar gaya! Plane " + currentMultiplier.toFixed(2) + "x par crash ho gaya.");
            }

            setTimeout(() => {
                startWaitingPhase();
            }, 3000);
        }

        function handleGameAction() {
            if (gameState === 'WAITING') {
                userBetPlaced = true;
                document.getElementById('actionBtn').innerText = "Bet Placed! Waiting...";
                document.getElementById('actionBtn').disabled = true;
            } else if (gameState === 'FLYING' && userBetPlaced && !userCashedOut) {
                userCashedOut = true;
                let won = currentMultiplier;
                score += Math.floor(won * 10);
                document.getElementById('gameScore').innerText = score;
                alert("Badhai ho! Aapne " + won.toFixed(2) + "x par Cash Out kar liya!");
                document.getElementById('actionBtn').innerText = "Cashed Out";
                document.getElementById('actionBtn').disabled = true;
            }
        }
    </script>
</body>
</html>
