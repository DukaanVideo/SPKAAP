<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator - Real Gaming Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; min-height: 100vh; padding: 10px; }
        
        .game-container {
            max-width: 480px;
            margin: 0 auto;
            background: #121622;
            border-radius: 14px;
            border: 1px solid #1e2638;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #161c2d;
            border-bottom: 1px solid #1e2638;
        }
        .logo-text { font-size: 16px; font-weight: bold; color: #f59e0b; letter-spacing: 1px; cursor: pointer; user-select: none; }
        .wallet-pill {
            background: #0b0e14;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #273046;
            font-size: 13px;
            color: #0ecb81;
            font-weight: bold;
        }
        .btn-home {
            background: #273046;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        /* Multiplier History Bar */
        .history-bar {
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            background: #0b0e14;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid #1e2638;
        }
        .history-pill {
            background: #161c2d;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            color: #38bdf8;
            border: 1px solid #273046;
        }
        .history-pill.high { color: #0ecb81; border-color: #0ecb8133; }

        /* Main Game Screen */
        .game-screen {
            height: 240px;
            background: radial-gradient(circle at center, #1a2236 0%, #0b0e14 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid #1e2638;
            overflow: hidden;
        }
        .multiplier-display {
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(14, 203, 129, 0.4);
            letter-spacing: 1px;
        }
        .status-msg {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .plane-icon {
            font-size: 45px;
            position: absolute;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.6));
        }

        /* Betting Control Panel */
        .control-panel {
            padding: 16px;
            background: #121622;
        }
        .bet-box-container {
            background: #161c2d;
            border: 1px solid #273046;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .bet-row label { font-size: 12px; color: #94a3b8; font-weight: 600; }
        
        .input-group {
            display: flex;
            align-items: center;
            background: #0b0e14;
            border: 1px solid #273046;
            border-radius: 8px;
            overflow: hidden;
            width: 140px;
        }
        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            padding: 8px;
            font-size: 15px;
            text-align: center;
            font-weight: bold;
            outline: none;
        }
        
        .quick-chips {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .chip {
            background: #1e2638;
            border: 1px solid #273046;
            color: #cbd5e1;
            padding: 6px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .chip:active { background: #334155; }

        /* Action Buttons */
        .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-bet { background: linear-gradient(135deg, #0ecb81, #059669); color: #fff; }
        .btn-cashout { background: linear-gradient(135deg, #f59e0b, #d97706); color: #121622; display: none; }

        /* Hidden Secret Admin Modal */
        #adminModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            padding: 20px;
            overflow-y: auto;
        }
        .admin-box {
            background: #1e293b;
            border: 1px solid #f59e0b;
            border-radius: 12px;
            padding: 16px;
            max-width: 450px;
            margin: 30px auto;
        }
        .admin-box h3 { color: #f59e0b; font-size: 16px; margin-bottom: 12px; text-align: center; }
        .req-card {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .req-card p { margin-bottom: 4px; color: #cbd5e1; }
        .req-card span { color: #38bdf8; font-weight: bold; }
        .btn-approve { background: #22c55e; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 6px; }
        .btn-close-admin { background: #ef4444; color: white; border: none; padding: 8px; width: 100%; border-radius: 6px; margin-top: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Top Navigation (Title par 7 baar click karne par Admin khulega) -->
        <div class="top-bar">
            <button class="btn-home" onclick="window.location.href='index.html'">← Home</button>
            <div class="logo-text" id="secretTrigger">⚡ AVIATOR PRO</div>
            <div class="wallet-pill">₹ <span id="game-balance">0.00</span></div>
        </div>

        <!-- Live Multiplier History -->
        <div class="history-bar">
            <div class="history-pill">1.12x</div>
            <div class="history-pill high">3.45x</div>
            <div class="history-pill">1.05x</div>
            <div class="history-pill high">5.80x</div>
        </div>

        <!-- Game Screen Animation Area -->
        <div class="game-screen">
            <div class="plane-icon" id="planeIcon" style="left: 30px; bottom: 30px;">✈️</div>
            <div class="multiplier-display" id="multiplierDisplay">1.00x</div>
            <div class="status-msg" id="gameStatus">Waiting for next round...</div>
        </div>

        <!-- Betting Controls -->
        <div class="control-panel">
            <div class="bet-box-container">
                <div class="bet-row">
                    <label>Bet Amount (₹)</label>
                    <div class="input-group">
                        <input type="number" id="betAmount" value="100">
                    </div>
                </div>
                <div class="quick-chips">
                    <div class="chip" onclick="setBet(50)">₹50</div>
                    <div class="chip" onclick="setBet(100)">₹100</div>
                    <div class="chip" onclick="setBet(500)">₹500</div>
                    <div class="chip" onclick="setBet(1000)">₹1000</div>
                </div>
            </div>

            <button class="btn-action btn-bet" id="btnBet" onclick="placeBet()">PLACE BET</button>
            <button class="btn-action btn-cashout" id="btnCashout" onclick="cashOut()">CASHOUT</button>
        </div>
    </div>

    <!-- Hidden Secret Admin Modal -->
    <div id="adminModal">
        <div class="admin-box">
            <h3>🔐 Secret Admin Deposit Approval</h3>
            <div id="adminReqList">
                <p style="text-align:center; color:#94a3b8;">Koi nayi request nahi hai.</p>
            </div>
            <button class="btn-close-admin" onclick="closeAdminPanel()">Close Admin Panel</button>
        </div>
    </div>

    <script>
        let balance = parseFloat(localStorage.getItem('user_wallet_balance')) || 0.00;
        document.getElementById('game-balance').innerText = balance.toFixed(2);

        // --- Secret 7-Click Admin Unlock System with Password 904402 ---
        let clickCount = 0;
        document.getElementById('secretTrigger').addEventListener('click', () => {
            clickCount++;
            if(clickCount >= 7) {
                clickCount = 0;
                let pass = prompt("Enter Secret Admin Password:");
                if(pass === "904402") {
                    openAdminPanel();
                } else if(pass !== null) {
                    alert("Galat Password!");
                }
            }
        });

        function openAdminPanel() {
            document.getElementById('adminModal').style.display = 'block';
            loadAdminRequests();
        }

        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function loadAdminRequests() {
            let requests = JSON.parse(localStorage.getItem('admin_deposit_requests')) || [];
            let listDiv = document.getElementById('adminReqList');

            if(requests.length === 0) {
                listDiv.innerHTML = `<p style="text-align:center; color:#94a3b8;">Abhi koi deposit request nahi aayi hai.</p>`;
                return;
            }

            let html = '';
            requests.forEach((req, index) => {
                html += `
                    <div class="req-card">
                        <p><strong>Mobile/User:</strong> <span>${req.phone || 'Customer'}</span></p>
                        <p><strong>Amount:</strong> <span>₹${req.amount}</span></p>
                        <p><strong>UTR Number:</strong> <span>${req.utr}</span></p>
                        <button class="btn-approve" onclick="approveDeposit(${index}, ${req.amount})">YES (Approve Real Pay)</button>
                    </div>
                `;
            });
            listDiv.innerHTML = html;
        }

        function approveDeposit(index, amount) {
            if(confirm(`Kya aap ₹${amount} ka real payment verify karke approve karna chahte hain?`)) {
                let userBal = parseFloat(localStorage.getItem('user_wallet_balance')) || 0.00;
                userBal += amount;
                localStorage.setItem('user_wallet_balance', userBal);
                document.getElementById('game-balance').innerText = userBal.toFixed(2);

                let requests = JSON.parse(localStorage.getItem('admin_deposit_requests')) || [];
                requests.splice(index, 1);
                localStorage.setItem('admin_deposit_requests', JSON.stringify(requests));

                alert('Approved! Balance customer ke account mein jud gaya hai.');
                loadAdminRequests();
            }
        }

        // --- Aviator Game Core Logic ---
        let gameInterval;
        let currentMultiplier = 1.00;
        let currentBet = 0;
        let isPlaying = false;
        let crashPoint = 1.00;

        function setBet(amount) {
            document.getElementById('betAmount').value = amount;
        }

        function placeBet() {
            let amount = parseFloat(document.getElementById('betAmount').value);
            if(!amount || amount <= 0) {
                alert('Kripya sahi amount daalein!');
                return;
            }
            if(amount > balance) {
                alert('Wallet mein insufficient balance hai! Pehle deposit karein.');
                return;
            }

            balance -= amount;
            currentBet = amount;
            localStorage.setItem('user_wallet_balance', balance);
            document.getElementById('game-balance').innerText = balance.toFixed(2);

            document.getElementById('btnBet').style.display = 'none';
            document.getElementById('btnCashout').style.display = 'block';

            startAviatorGame();
        }

        function startAviatorGame() {
            isPlaying = true;
            currentMultiplier = 1.00;
            crashPoint = (Math.random() * (4.50 - 1.20) + 1.20).toFixed(2);

            let plane = document.getElementById('planeIcon');
            plane.style.transform = 'translate(0px, 0px) rotate(0deg)';

            gameInterval = setInterval(() => {
                currentMultiplier += 0.03;
                document.getElementById('multiplierDisplay').innerText = currentMultiplier.toFixed(2) + 'x';
                document.getElementById('gameStatus').innerText = 'Flying high...';

                let moveX = Math.min(180, (currentMultiplier - 1) * 50);
                let moveY = Math.min(110, (currentMultiplier - 1) * 35);
                plane.style.transform = `translate(${moveX}px, -${moveY}px) rotate(15deg)`;

                if(currentMultiplier >= parseFloat(crashPoint)) {
                    clearInterval(gameInterval);
                    gameCrash();
                }
            }, 100);
        }

        function cashOut() {
            if(!isPlaying) return;
            clearInterval(gameInterval);

            let winAmount = currentBet * currentMultiplier;
            balance += winAmount;
            localStorage.setItem('user_wallet_balance', balance);
            document.getElementById('game-balance').innerText = balance.toFixed(2);

            document.getElementById('gameStatus').innerHTML = `<span style="color: #0ecb81;">Won ₹${winAmount.toFixed(2)}!</span>`;
            resetGameUI();
        }

        function gameCrash() {
            isPlaying = false;
            document.getElementById('gameStatus').innerHTML = `<span style="color: #ef4444;">Flew Away! @ ${crashPoint}x</span>`;
            document.getElementById('planeIcon').style.transform = 'translate(200px, -150px) rotate(60deg)';
            resetGameUI();
        }

        function resetGameUI() {
            isPlaying = false;
            setTimeout(() => {
                document.getElementById('btnCashout').style.display = 'none';
                document.getElementById('btnBet').style.display = 'block';
                document.getElementById('multiplierDisplay').innerText = '1.00x';
                document.getElementById('gameStatus').innerText = 'Waiting for next round...';
                document.getElementById('planeIcon').style.transform = 'translate(0px, 0px) rotate(0deg)';
            }, 3000);
        }
    </script>
</body>
</html>
