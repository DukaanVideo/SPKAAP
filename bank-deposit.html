<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Deposit - Gaming Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; padding: 16px; min-height: 100vh; }
        .container { max-width: 450px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        h2 { font-size: 18px; color: #f59e0b; text-align: center; margin-bottom: 16px; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 14px; outline: none; }
        
        .bank-box { background: #0f172a; padding: 14px; border-radius: 8px; border: 1px dashed #f59e0b; margin-bottom: 16px; font-size: 13px; line-height: 1.6; color: #cbd5e1; }
        .bank-box span { color: #38bdf8; font-weight: bold; }

        .btn-submit { width: 100%; background-color: #22c55e; color: white; border: none; padding: 11px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .btn-back { width: 100%; background-color: #475569; color: white; border: none; padding: 9px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 8px; }
        .note { font-size: 11px; color: #64748b; text-align: center; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Direct Bank Deposit</h2>

        <!-- Bank Selection Dropdown -->
        <div class="form-group">
            <label>Apni Bank Chunein (Select Bank)</label>
            <select id="bankSelect" onchange="updateBankDetails()">
                <option value="sbi">State Bank of India (SBI)</option>
                <option value="pnb">Punjab National Bank (PNB)</option>
                <option value="bob">Bank of Baroda (BOB)</option>
                <option value="central">Central Bank of India</option>
                <option value="hdfc">HDFC Bank</option>
                <option value="icici">ICICI Bank</option>
                <option value="axis">Axis Bank</option>
                <option value="kotak">Kotak Mahindra Bank</option>
                <option value="union">Union Bank of India</option>
                <option value="airtel">Airtel Payments Bank</option>
            </select>
        </div>

        <!-- Dynamic Bank Details Box -->
        <div class="bank-box" id="bankDetailsBox">
            <strong>A/C Name:</strong> <span id="accName">Yolo Gaming Ventures</span><br>
            <strong>A/C Number:</strong> <span id="accNumber">123456789012</span><br>
            <strong>IFSC Code:</strong> <span id="ifscCode">SBIN0001234</span><br>
            <strong>Bank Name:</strong> <span id="bankName">State Bank of India</span>
        </div>

        <div class="form-group">
            <label>Kitna Amount Transfer Kiya Hai? (₹)</label>
            <input type="number" id="bank-amount" placeholder="Amount daalein">
        </div>
        <div class="form-group">
            <label>Bank Reference / UTR Number</label>
            <input type="text" id="bank-utr" placeholder="Reference number daalein">
        </div>
        <div class="form-group">
            <label>Transfer Receipt Screenshot Upload Karein</label>
            <input type="file" id="bank-screenshot" accept="image/*" style="font-size: 12px; color: #cbd5e1;">
        </div>

        <button class="btn-submit" onclick="submitBankDeposit()">Bank Deposit Request Bhejein</button>
        <button class="btn-back" onclick="window.location.href='index.html'">Wapas Home Par Jayein</button>
        <div class="note">Bank transfer verify hone ke baad wallet mein balance jod diya jayega.</div>
    </div>

    <script>
        // Sabhi banks ki details (Aap yahan apne asli account number daal sakte hain)
        const bankData = {
            sbi: { name: "Yolo Gaming Ventures", acc: "123456789012", ifsc: "SBIN0001234", bank: "State Bank of India" },
            pnb: { name: "Yolo Gaming Ventures", acc: "567890123456", ifsc: "PUNB0123456", bank: "Punjab National Bank" },
            bob: { name: "Yolo Gaming Ventures", acc: "678901234567", ifsc: "BARB0RASULA", bank: "Bank of Baroda" },
            central: { name: "Yolo Gaming Ventures", acc: "901234567890", ifsc: "CBIN0281234", bank: "Central Bank of India" },
            hdfc: { name: "Yolo Gaming Ventures", acc: "123412341234", ifsc: "HDFC0001234", bank: "HDFC Bank" },
            icici: { name: "Yolo Gaming Ventures", acc: "234523452345", ifsc: "ICIC0001234", bank: "ICICI Bank" },
            axis: { name: "Yolo Gaming Ventures", acc: "345634563456", ifsc: "UTIB0001234", bank: "Axis Bank" },
            kotak: { name: "Yolo Gaming Ventures", acc: "456745674567", ifsc: "KKBK0001234", bank: "Kotak Mahindra Bank" },
            union: { name: "Yolo Gaming Ventures", acc: "567856785678", ifsc: "UBIN0531234", bank: "Union Bank of India" },
            airtel: { name: "Yolo Gaming Ventures", acc: "998877665544", ifsc: "AIRP0000001", bank: "Airtel Payments Bank" }
        };

        function updateBankDetails() {
            let selected = document.getElementById('bankSelect').value;
            let data = bankData[selected];
            document.getElementById('accName').innerText = data.name;
            document.getElementById('accNumber').innerText = data.acc;
            document.getElementById('ifscCode').innerText = data.ifsc;
            document.getElementById('bankName').innerText = data.bank;
        }

        function submitBankDeposit() {
            let amount = document.getElementById('bank-amount').value;
            let utr = document.getElementById('bank-utr').value;
            let bankName = document.getElementById('bankName').innerText;

            if(!amount || !utr) {
                alert('Kripya Amount aur UTR number bharein!');
                return;
            }

            let currentUser = localStorage.getItem('portal_user') || 'Customer';
            let requests = JSON.parse(localStorage.getItem('admin_deposit_requests')) || [];
            
            requests.push({
                phone: currentUser,
                amount: parseFloat(amount),
                utr: utr + ' (' + bankName + ')',
                time: new Date().toLocaleString()
            });

            localStorage.setItem('admin_deposit_requests', JSON.stringify(requests));

            alert(`Aapki ₹${amount} ki Bank Deposit request bhej di gayi hai! Verification ke baad balance update hoga.`);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
