<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal - Gaming Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; padding: 16px; min-height: 100vh; }
        .container { max-width: 450px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        h2 { font-size: 18px; color: #f59e0b; text-align: center; margin-bottom: 16px; }
        
        .wallet-box { background: #0f172a; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 16px; border: 1px solid #475569; }
        .wallet-box p { font-size: 12px; color: #94a3b8; }
        .wallet-box h3 { font-size: 20px; color: #0ecb81; margin-top: 4px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; font-weight: bold; }
        input { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 14px; outline: none; }
        
        .btn-submit { width: 100%; background: linear-gradient(135deg, #f59e0b, #d97706); color: #121622; border: none; padding: 11px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .btn-back { width: 100%; background-color: #475569; color: white; border: none; padding: 9px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 8px; }
        .note { font-size: 11px; color: #64748b; text-align: center; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📤 Bank Withdrawal (Paisa Nikalein)</h2>

        <!-- Available Balance Box -->
        <div class="wallet-box">
            <p>Available Balance</p>
            <h3>₹ <span id="withdrawBalance">0.00</span></h3>
        </div>

        <div class="form-group">
            <label>Account Holder Name (Khata Dhaarak ka Naam)</label>
            <input type="text" id="accHolderName" placeholder="Apna pura naam daalein">
        </div>

        <div class="form-group">
            <label>Bank Account Number</label>
            <input type="text" id="withdrawAccNo" placeholder="Apna bank account number daalein">
        </div>

        <div class="form-group">
            <label>IFSC Code</label>
            <input type="text" id="withdrawIfsc" placeholder="Bank ka IFSC code daalein">
        </div>

        <div class="form-group">
            <label>Kitna Amount Nikalna Hai? (₹)</label>
            <input type="number" id="withdrawAmount" placeholder="Amount daalein (Jaise: 500)">
        </div>

        <button class="btn-submit" onclick="submitWithdrawal()">Withdrawal Request Bhejein</button>
        <button class="btn-back" onclick="window.location.href='index.html'">Wapas Home Par Jayein</button>
        <div class="note">Withdrawal request approve hone ke baad aapke bank account mein paise bhej diye jayenge.</div>
    </div>

    <script>
        // Local storage se current balance dikhana
        let balance = parseFloat(localStorage.getItem('user_wallet_balance')) || 0.00;
        document.getElementById('withdrawBalance').innerText = balance.toFixed(2);

        function submitWithdrawal() {
            let name = document.getElementById('accHolderName').value;
            let accNo = document.getElementById('withdrawAccNo').value;
            let ifsc = document.getElementById('withdrawIfsc').value;
            let amount = parseFloat(document.getElementById('withdrawAmount').value);

            if(!name || !accNo || !ifsc || !amount) {
                alert('Kripya sabhi bank details aur amount bharein!');
                return;
            }

            if(amount > balance) {
                alert('Wallet mein insufficient balance hai!');
                return;
            }

            // Balance turant kaat lena ya admin approval ke liye bhejna
            balance -= amount;
            localStorage.setItem('user_wallet_balance', balance);

            let currentUser = localStorage.getItem('portal_user') || 'Customer';
            let requests = JSON.parse(localStorage.getItem('admin_withdrawal_requests')) || [];
            
            requests.push({
                phone: currentUser,
                name: name,
                acc: accNo,
                ifsc: ifsc,
                amount: amount,
                time: new Date().toLocaleString()
            });

            localStorage.setItem('admin_withdrawal_requests', JSON.stringify(requests));

            alert(`Aapki ₹${amount} ki Withdrawal request bhej di gayi hai! Jaldi hi aapke account mein transfer ho jayegi.`);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
